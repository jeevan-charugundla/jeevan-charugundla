name: Refresh animated profile cards
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow fonttools brotli
      - name: Fetch contribution calendar and repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          query='''query { user(login:"jeevan-charugundla") { name contributionsCollection { contributionCalendar { weeks { contributionDays { date contributionCount } } } } repositories(first:100,ownerAffiliations:OWNER,privacy:PUBLIC,orderBy:{field:UPDATED_AT,direction:DESC}) { nodes { name description url stargazerCount isFork primaryLanguage { name } } } } }'''
          req=urllib.request.Request('https://api.github.com/graphql',data=json.dumps({'query':query}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'})
          result=json.load(urllib.request.urlopen(req))
          if result.get('errors'): raise SystemExit(json.dumps(result['errors']))
          user=result['data']['user']
          # Restore the exact portrait image supplied for this README (stored as base64 text).
          import base64
          with open('assets/portrait-source.jpg.b64','rb') as source:
            portrait_bytes=base64.b64decode(source.read())
          with open('assets/portrait-embed.jpg','wb') as target:
            target.write(portrait_bytes)
          cal=user['contributionsCollection']['contributionCalendar']
          days=[day for week in cal['weeks'] for day in week['contributionDays']]
          repos=[r for r in user['repositories']['nodes'] if not r['isFork']]
          preferred=['SekhoEasy','Learnwise-Ai','WindowsAi','zero-waste-grocery','gdp-dashboard']
          by={r['name'].lower():r for r in repos}; chosen=[by[n.lower()] for n in preferred if n.lower() in by]
          for r in repos:
            if len(chosen)>=5: break
            if r not in chosen: chosen.append(r)
          curated_descriptions={
            'learnwise-ai':'AI-powered study platform with Groq question generation, answer evaluation, progress analytics and a conversational study assistant. React + FastAPI + Supabase.',
            'windowsai':'A Windows desktop AI companion with screen understanding, visual click guidance, chat and voice input. WPF/.NET 8 + TypeScript.',
            'zero-waste-grocery':'Inventory intelligence for low-waste grocery operations: CSV imports, stock validation and actionable inventory insights. React + FastAPI + Supabase.',
          }
          snapshot={'profile':{'name':user.get('name') or 'Jeevan Charugundla'},'daily':days,'featured_repos':[{'name':r['name'],'description':curated_descriptions.get(r['name'].lower(),r.get('description') or 'A project built to solve a real problem.'),'language':(r.get('primaryLanguage') or {}).get('name') or 'Software','html_url':r['url'],'stargazers_count':r['stargazerCount']} for r in chosen[:5]]}
          open('data/contributions.json','w').write(json.dumps(snapshot,indent=2))
          # Keep each visible project's clickable destination in the exact same order as its SVG card.
          import html
          project_links=[]
          for i, repo in enumerate(snapshot['featured_repos'][:3], 1):
            name=html.escape(repo['name'], quote=True)
            url=html.escape(repo['html_url'], quote=True)
            project_links.append(f'<a href="{url}"><img src="cards/project-{i:02d}.svg" width="32.5%" alt="{name}"/></a>')
          project_section='''<img src="cards/title-coding.svg" width="100%" alt="What I'm coding"/>

          ''' + '\n'.join(project_links)
          readme_path='README.md'
          readme=open(readme_path,encoding='utf-8').read()
          start='<!-- FEATURED_PROJECTS_START -->'
          end='<!-- FEATURED_PROJECTS_END -->'
          if start not in readme or end not in readme:
            raise SystemExit('README featured-project markers are missing; refusing to rewrite the wrong section.')
          before, remainder=readme.split(start,1)
          _, after=remainder.split(end,1)
          open(readme_path,'w',encoding='utf-8').write(before+start+'\n'+project_section+'\n'+end+after)
          PY
      - name: Render SVG cards
        run: python render_cards.py
      - name: Commit refreshed cards
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          # Preserve freshly rendered outputs, then rebase the work on the latest README/main.
          tmp="$(mktemp -d)"
          cp data/contributions.json "$tmp/contributions.json"
          cp -a cards "$tmp/cards"
          cp assets/portrait-embed.jpg "$tmp/portrait-embed.jpg"
          git fetch origin main
          git reset --hard origin/main
          cp "$tmp/contributions.json" data/contributions.json
          rm -rf cards
          cp -a "$tmp/cards" cards
          cp "$tmp/portrait-embed.jpg" assets/portrait-embed.jpg
          # Rebuild only the marked project section from the same data used for the SVGs.
          python - <<'PY'
          import json, html
          from pathlib import Path
          data=json.loads(Path('data/contributions.json').read_text(encoding='utf-8'))
          links=[]
          for i, repo in enumerate(data.get('featured_repos',[])[:3],1):
            name=html.escape(repo['name'],quote=True)
            url=html.escape(repo['html_url'],quote=True)
            links.append(f'<a href="{url}"><img src="cards/project-{i:02d}.svg" width="32.5%" alt="{name}"/></a>')
          section='<img src="cards/title-coding.svg" width="100%" alt="What I\'m coding"/>' + chr(10)*2 + chr(10).join(links)
          path=Path('README.md')
          readme=path.read_text(encoding='utf-8')
          start='<!-- FEATURED_PROJECTS_START -->'
          end='<!-- FEATURED_PROJECTS_END -->'
          if start not in readme or end not in readme:
            raise SystemExit('README project markers missing; refusing to rewrite an unmarked section.')
          before, rest=readme.split(start,1)
          _, after=rest.split(end,1)
          path.write_text(before+start+chr(10)+section+chr(10)+end+after,encoding='utf-8')
          PY
          git add README.md data/contributions.json cards/ assets/portrait-embed.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile cards'
            git push origin HEAD:main
          fi
